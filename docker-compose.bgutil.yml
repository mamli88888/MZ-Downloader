# bgutil PO Token server for yt-dlp YouTube bot-detection bypass
#
# This container generates Proof-of-Origin (PO) Tokens that YouTube requires
# to download videos without the "Sign in to confirm you are not a bot"
# challenge. yt-dlp auto-discovers the bgutil plugin (installed via
# `pip install bgutil-ytdlp-pot-provider`) and calls this server.
#
# Usage:
#   docker compose -f docker-compose.bgutil.yml up -d
#
# Verify it's running:
#   curl http://127.0.0.1:4416/ping
#
# Updating (recommended weekly):
#   docker compose -f docker-compose.bgutil.yml pull
#   docker compose -f docker-compose.bgutil.yml up -d
#
# The watchtower sidecar below auto-pulls a new image once per day and
# restarts the bgutil container. Disable it by commenting out the service
# if you'd rather update manually.

services:
  bgutil-pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: bgutil-pot-provider
    init: true
    restart: unless-stopped
    ports:
      # Bind to 127.0.0.1 only — the bot talks to it over localhost. Don't
      # expose this to the public internet (the server has no auth).
      - "127.0.0.1:4416:4416"
    environment:
      # Token TTL in hours. Default 6h is what bgutil recommends — short
      # enough that YouTube rarely invalidates them, long enough to avoid
      # re-generating on every request.
      TOKEN_TTL: "6"
      # If the bot is running inside Iran (or any restricted network),
      # uncomment the following lines to make bgutil reach YouTube through
      # a foreign proxy. The proxy must be reachable from this container.
      # HTTP_PROXY: "http://user:pass@your-foreign-proxy:3128"
      # HTTPS_PROXY: "http://user:pass@your-foreign-proxy:3128"
      # NO_PROXY: "localhost,127.0.0.1"
    labels:
      - com.centurylinklabs.watchtower.scope=bgutil
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:4416/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  watchtower:
    image: ghcr.io/containrrr/watchtower
    container_name: bgutil-watchtower
    restart: unless-stopped
    command: --cleanup --scope bgutil --interval 86400 --include-restarting
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
